<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마스터볼까지 몇판? 계산기</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8f8f8;
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .result-box {
      background-color: #f0f8ff;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      max-width: 100%;
      padding: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .submit-button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      margin: 20px 0;
    }

    .button-pair {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .button-pair button {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #2196F3;
      color: white;
      cursor: pointer;
    }

    .error {
      color: red;
      margin-top: 20px;
    }

    @media screen and (max-width: 600px) {
      .form-row {
        flex-direction: column;
      }

      .button-pair {
        flex-direction: row;
      }

      .form-group input {
        font-size: 18px;
      }

      .submit-button, .button-pair button {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 마스터볼까지 몇판? 🎮<br>🖩 계산기 🖩</h1>

    {% if result %}
      <div class="result-box">
        마스터볼까지의 기대 판 수: {{ result }}판<br>
        (승률: {{ "%.2f"|format(rate) }}%)
      </div>
    {% elif error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <!-- 현재 포인트 입력 -->
      <div class="form-row">
        <div class="form-group" style="flex: 1;">
          <label>현재 포인트</label>
          <input type="number" name="current" value="{{ current }}">
        </div>
      </div>

      <!-- 승리/패배 판 수 -->
      <div class="form-row">
        <div class="form-group">
          <label>승리 판 수</label>
          <input type="number" name="win" value="{{ win }}">
        </div>
        <div class="form-group">
          <label>패배 판 수</label>
          <input type="number" name="lose" value="{{ lose }}">
        </div>
      </div>

      <!-- 계산 버튼 -->
      <button class="submit-button" type="submit">계산하기</button>

      <!-- 승리/패배 추가 버튼 -->
      <div class="button-pair">
        <button name="adjust" value="win-btn">승리 추가</button>
        <button name="adjust" value="lose-btn">패배 추가</button>
      </div>
    </form>
  </div>
</body>
</html>
