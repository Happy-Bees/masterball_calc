<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마스터볼까지 몇판? 계산기</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8f8f8;
      text-align: center;
      padding: 30px;
      margin: 0;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .result-box {
      background-color: #f0f8ff;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-row label {
      font-weight: bold;
      min-width: 90px;
    }

    .input-row input {
      padding: 8px;
      width: 100px;
      font-size: 16px;
      text-align: center;
    }

    .half-input {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .half-input .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .main-buttons button,
    .submit-button {
      padding: 8px 12px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .main-buttons button {
      background-color: #2196F3;
    }

    .submit-button {
      margin-top: 20px;
      background-color: #4CAF50;
      width: 100%;
    }

    .error {
      color: red;
      margin-top: 20px;
    }

    @media screen and (max-width: 600px) {
      .input-row {
        flex-direction: column;
        align-items: stretch;
      }

      .half-input {
        flex-direction: column;
        gap: 15px;
      }

      .input-row input,
      .submit-button,
      .main-buttons button {
        width: 100%;
        font-size: 18px;
      }

      .main-buttons {
        flex-direction: row;
        gap: 10px;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 마스터볼까지 몇판? 🎮<br>🖩 계산기 🖩</h1>

    {% if result %}
      <div class="result-box">
        마스터볼까지의 기대 판 수: {{ result }}판<br>
        (승률: {{ "%.2f"|format(rate) }}%)
      </div>
    {% elif error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="input-row">
        <label>현재 포인트</label>
        <input type="number" name="current" value="{{ current }}">
      </div>

      <div class="half-input">
        <div class="input-group">
          <label>승리 판 수</label>
          <input type="number" name="win" value="{{ win }}">
        </div>

        <div class="input-group">
          <label>패배 판 수</label>
          <input type="number" name="lose" value="{{ lose }}">
        </div>
      </div>

      <button class="submit-button" type="submit">계산하기</button>

      <div class="main-buttons">
        <button name="adjust" value="win-btn">승리 추가</button>
        <button name="adjust" value="lose-btn">패배 추가</button>
      </div>
    </form>
  </div>
</body>
</html>
