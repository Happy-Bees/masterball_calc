<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마스터볼까지 몇판? 계산기</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8f8f8;
      text-align: center;
      padding: 30px;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 28px;
      line-height: 1.5;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      gap: 10px;
    }

    .input-row label {
      font-weight: bold;
      min-width: 90px;
    }

    .input-row input {
      padding: 8px;
      width: 100px;
      font-size: 16px;
      text-align: center;
    }

    .main-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .main-buttons button,
    .submit-button {
      padding: 8px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
    }

    .main-buttons button {
      background-color: #2196F3;
    }

    .submit-button {
      margin-top: 20px;
      background-color: #4CAF50;
    }

    .result {
      margin-top: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      color: red;
      margin-top: 20px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 마스터볼까지 몇판? 🎮<br>🖩 계산기 🖩</h1>

    <form method="POST">
      <div class="input-row">
        <label>현재 포인트</label>
        <input type="number" name="current" value="{{ current }}">
      </div>

      <div class="input-row">
        <label>승리 판 수</label>
        <input type="number" name="win" value="{{ win }}">
      </div>

      <div class="input-row">
        <label>패배 판 수</label>
        <input type="number" name="lose" value="{{ lose }}">
      </div>

      <button class="submit-button" type="submit">계산하기</button>

      <div class="main-buttons">
        <button name="adjust" value="win-btn">승리 추가 (+10pt & 승+1)</button>
        <button name="adjust" value="lose-btn">패배 추가 (-7pt & 패+1)</button>
      </div>
    </form>

    {% if result %}
      <div class="result">
        마스터볼까지의 기대 판 수: {{ result }}판<br>
        (승률: {{ "%.2f"|format(rate) }}%)
      </div>
    {% elif error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
